spring.application.name=auth-module
server.port=8080

# Staging Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db_staging}
spring.datasource.username=${DB_USER:staging}
spring.datasource.password=${DB_PASSWORD:staging_password}
spring.datasource.hikari.maximum-pool-size=15
spring.jpa.hibernate.ddl-auto=validate

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Logging - Info level in staging
logging.level.root=INFO
logging.level.com.authmodule=INFO
logging.level.org.springframework.security=INFO

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
