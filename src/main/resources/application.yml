spring:
  application:
    name: plagiarism-detection-system
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  data:
    mongodb:
      host: ${MONGODB_HOST:localhost}
      port: ${MONGODB_PORT:27017}
      database: ${MONGODB_DATABASE:plagiarism_db}
      username: ${MONGODB_USERNAME:}
      password: ${MONGODB_PASSWORD:}
      authentication-database: ${MONGODB_AUTH_DB:admin}
      auto-index-creation: true
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
  
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json

jwt:
  secret: ${JWT_SECRET:mySecretKeyWithAtLeast32CharactersLongForHS512}
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days

storage:
  location: ${STORAGE_PATH:./storage}
  upload-dir: ${storage.location}/uploads
  extract-dir: ${storage.location}/extracted
  report-dir: ${storage.location}/reports

jplag:
  jar-path: ${JPLAG_PATH:./jplag/jplag.jar}
  language: java
  timeout-minutes: 30
  max-submissions: 100

delta:
  loc-threshold: 50
  method-threshold: 5
  token-threshold: 100
  suspicious-flag: true

logging:
  level:
    com.plagiarism: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
    org.springframework.security: INFO
  file:
    name: logs/plagiarism-system.log
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true